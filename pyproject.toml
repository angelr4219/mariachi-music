[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mariachi_music"
version = "0.1.0"
description = "Music transcription and sheet music generation for mariachi and beyond"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pretty_midi>=0.2.10",
    "music21>=9.1",
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy>=1.24",
    "scipy>=1.11",
    "PyQt5>=5.15",
]

[project.optional-dependencies]
transcription = [
    "yt-dlp>=2024.1",
    "demucs>=4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
mariachi-scale  = "mariachi_music.cli.create_scale:main"
mariachi-score  = "mariachi_music.cli.create_score:main"
mariachi-export = "mariachi_music.cli.export_score:main"
mariachi-transcribe = "mariachi_music.cli.transcribe_audio:main"
mariachi-gui    = "mariachi_music.gui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mariachi_music*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
